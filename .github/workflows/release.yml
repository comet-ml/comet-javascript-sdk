name: Release
# Publishes the package to npm when a MAJOR.MINOR.PATCH tag is pushed on
# master. See "Release" in the README.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protect this environment (required reviewers) in the repo settings to
    # approve each publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # for origin/master, to check the tag is on it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (no token) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11.5.1
      # Only reviewed code is published: a tag on a commit that never reached
      # master (e.g. on a feature branch) is refused.
      - name: Check the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master; only master is released."
            exit 1
          fi
      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION."
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - name: Check the committed bundle and docs are up to date
        run: |
          npm run pack
          npm run docs
          if ! git diff --exit-code -- build/ docs/; then
            echo "::error::build/ or docs/ is out of date for this tag."
            exit 1
          fi
      # prepublishOnly lints, tests, and builds lib/ and the bundle first.
      # Authenticates with npm trusted publishing, or with an NPM_TOKEN
      # secret if one is set.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
